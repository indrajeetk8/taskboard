services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskuser -d taskdb']
      interval: 5s
      retries: 10
  api:
    image: taskboard-api:v1
    environment:
      DATABASE_URL: postgresql://taskuser:taskpass@db:5432/taskdb
    depends_on:
      db:
        condition: service_healthy
  web:
    image: taskboard-web:v1
    ports:
      - '8080:80'
    depends_on:
      - api
volumes:
  dbdata:
